  <head><script>
(()=>{
 const base="/glavny-geroy-play", backend='https://mainhero.171-22-130-60.nip.io';
 window.__pagesPath=()=>location.hash.startsWith('#/')?location.hash.slice(1).split('?')[0]:'/play/couple';
 const route=(u)=>{const v=new URL(u,location.href);if(v.origin!==location.origin)return v.href;const p=v.pathname;
  if(p===base+'/'||p.startsWith(base+'/#'))return v.href;
  if(p==='/stories'||p.startsWith('/studio/')||p.startsWith('/gift/'))return backend+p+v.search;
  return base+'/'+v.search+'#'+p;
 };
 for(const key of ['pushState','replaceState']){const original=history[key].bind(history);history[key]=(s,t,u)=>{if(u==null)return original(s,t,u);const next=route(u);if(new URL(next,location.href).origin!==location.origin){location.assign(next);return;}return original(s,t,next);};}
 document.addEventListener('click',e=>{const a=e.target.closest?.('a[href]');if(!a||!a.getAttribute('href').startsWith('/'))return;e.preventDefault();const next=route(a.href);location.assign(next);if(new URL(next,location.href).origin===location.origin)location.reload();});
})();
</script>
